[project]
name = "kerrokantasi"
requires-python = ">=3.12, <3.13"
version = "2.10.5"
dependencies = [
    "Django~=5.2.15",
    "djangorestframework",
    "django-environ",
    "django-extensions",
    "django-helsinki-health-endpoints",
    "django-munigeo",
    "django-reversion",
    "django-cors-headers",
    "django-filter",
    "pillow",
    "psycopg[c]",
    "easy-thumbnails",
    "drf-nested-routers",
    "xlsxwriter",
    "django-helusers",
    "pyjwt",
    "jsonfield",
    "django-nested-admin",
    "django-geojson",
    "django-leaflet",
    "django-autoslug",
    "django-sendfile2",
    "django-parler",
    "langdetect",
    "sentry-sdk",
    "whitenoise",
    "social-auth-app-django",
    "python-pptx",
    "helsinki-profile-gdpr-api",
    "django-helsinki-notification[rest_framework] @ https://github.com/City-of-Helsinki/django-helsinki-notification/archive/refs/tags/v0.4.0.zip",
    "django-logger-extra @ https://github.com/City-of-Helsinki/django-logger-extra/archive/refs/tags/v0.1.0.zip",
    "django-resilient-logger @ https://github.com/City-of-Helsinki/django-resilient-logger/archive/refs/tags/v0.3.7.zip",
    "drf-spectacular",
]

[dependency-groups]
prod = [
    "uwsgi",
    "uwsgitop",
]
dev = [
    "coveralls",
    "distro",
    "django-debug-toolbar",
    "factory-boy",
    "freezegun",
    "jose",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-factoryboy",
    "ipython",
    "requests-mock",
]

[tool.uv]
package = false
exclude-newer = "P3D"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I",
    # pep8-naming
    "N",
    # flake8-bugbear without opinionated rules
    "B0",
    # flake8-pie
    "PIE",
    # flake8-print
    "T20",
]
extend-per-file-ignores = { "*/migrations/*" = ["E501"], "*/tests/*" = ["E501", "N802"] }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kerrokantasi.settings.test_settings"
norecursedirs = ["bower_components", "node_modules", ".git", "venv"]
